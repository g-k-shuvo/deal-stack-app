# Test compose. PRD §18 DOCKER-03: bring up DB, migrate+seed, run full suite headless.
# Usage: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dcc_test
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENCRYPTION_KEY: dGVzdC0zMi1ieXRlLWtleS1mb3ItdGVzdGluZy1vbmx5IQ==
      DATABASE_URL: postgres://postgres:postgres@db:5432/dcc_test
      CI: "true"
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test:coverage"
