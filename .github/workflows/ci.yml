name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          APP_ENCRYPTION_KEY: dGVzdC0zMi1ieXRlLWtleS1mb3ItdGVzdGluZy1vbmx5IQ==

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          APP_ENCRYPTION_KEY: dGVzdC0zMi1ieXRlLWtleS1mb3ItdGVzdGluZy1vbmx5IQ==
      - run: pnpm e2e
        env:
          APP_ENCRYPTION_KEY: dGVzdC0zMi1ieXRlLWtleS1mb3ItdGVzdGluZy1vbmx5IQ==
          DCC_AI_MODE: mock
